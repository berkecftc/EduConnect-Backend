services:
  # PostgreSQL veritabanı servisi
  postgres:
    image: postgres:14
    container_name: educonnect-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: educonnect
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data # Verilerin yeniden başlatmalarda kaybolmamasını sağlar
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    networks:
      - educonnect-network

  # Redis cache ve oturum yönetimi servisi
  redis:
    image: redis/redis-stack:latest
    container_name: educonnect-redis
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:8001:8001" # RedisInsight için
    volumes:
      - redis-data:/data
    networks:
      - educonnect-network

  # RabbitMQ mesaj kuyruğu servisi
  rabbitmq:
    image: rabbitmq:3-management
    container_name: educonnect-rabbitmq
    hostname: educonnect-rabbitmq
    ports:
      - "127.0.0.1:5672:5672"   # Mikroservislerin bağlanacağı AMQP portu
      - "127.0.0.1:15672:15672" # Yönetim arayüzü (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - educonnect-network

  minio:
    image: quay.io/minio/minio
    container_name: educonnect-minio
    ports:
      - "127.0.0.1:9000:9000"   # API portu (Servislerinizin bağlanacağı port)
      - "127.0.0.1:9001:9001"   # Web Konsolu portu (Yönetim arayüzü)
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data # Resimlerin ve dosyaların kalıcı olarak saklanması için
    command: server /data --console-address ":9001"
    networks:
      - educonnect-network

  # Mailpit - Development için fake mail server
  mailpit:
    image: axllent/mailpit
    container_name: educonnect-mailpit
    restart: always
    ports:
      - "127.0.0.1:8025:8025"  # Web UI (http://localhost:8025)
      - "127.0.0.1:1025:1025"  # SMTP (Java uygulaması buraya istek atacak)
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - educonnect-network

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - educonnect-network
    restart: unless-stopped


networks:
   educonnect-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  ollama_data:
