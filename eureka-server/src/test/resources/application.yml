server:
  port: 0

spring:
  application:
    name: discovery-server
  main:
    banner-mode: "off"
  security:
    user:
      name: integration
      password: integration-secret

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:9/eureka/
  server:
    enable-self-preservation: false
