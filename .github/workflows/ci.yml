name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "revizyon/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven verify
        run: ./mvnw -B -ntp -Pci clean verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"
          retention-days: 7

  images:
    name: Publish images
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Image coordinates
        run: |
          echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/educonnect" >> "$GITHUB_ENV"
          echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "EXTRA_TAG=latest" >> "$GITHUB_ENV"
          echo "REVISION=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "ATTEST=true" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/bake-action@v6
        with:
          source: .
          files: docker-bake.hcl
          push: true
          set: |
            *.platform=linux/amd64

      - name: Summary
        run: |
          {
            echo "### Images"
            echo ""
            echo "IMAGE_REGISTRY=${REGISTRY}"
            echo ""
            echo "IMAGE_TAG=${TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
