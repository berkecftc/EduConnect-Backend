name: Security

on:
  pull_request:
  push:
    branches:
      - main
      - "revizyon/**"
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks (full history, .gitleaksignore baseline)
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner --verbose --exit-code 1

  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: SBOM (CycloneDX, runtime scopes)
        run: >
          ./mvnw -B -ntp -q org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
          -DoutputFormat=json -DoutputName=bom -DincludeTestScope=false -DexcludeArtifactId=common-test

      - name: OSV-Scanner
        run: >
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.6.0
          scan source --config /src/osv-scanner.toml -L /src/target/bom.json

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: target/bom.json
          retention-days: 30

  image:
    name: Container image vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build a service image
        env:
          TAG: scan
        run: docker buildx bake --load auth-services

      - name: Trivy (OS packages and bundled libraries)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src" aquasec/trivy:0.74.0
          image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          --ignorefile /src/.trivyignore educonnect/auth-services:scan
