spring:
  application:
    name: notification-service
  config:
    import: "classpath:educonnect-integration.yml"
  datasource:
    hikari:
      schema: notification_db
  jpa:
    properties:
      hibernate:
        default_schema: notification_db
  flyway:
    schemas: notification_db
    default-schema: notification_db
  mail:
    host: localhost
    port: 9
    test-connection: false

management:
  health:
    mail:
      enabled: false

app:
  mail:
    from: noreply@educonnect.test

educonnect:
  notification:
    unsubscribe-secret: integration-unsubscribe-secret-0123456789
